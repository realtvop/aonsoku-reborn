name: sync coordination-worker branch

on:
  push:
    branches: [main]
    paths:
      - "coordination-worker/**"
      - ".github/workflows/coordination-worker-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild generated Worker branch
        run: |
          worker_commit="$(git subtree split --prefix=coordination-worker main)"
          git push origin "${worker_commit}:refs/heads/coordination-worker" --force
