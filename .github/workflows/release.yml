name: "publish"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15-intel"
            target: "darwin"
            arch: "x64"
          - platform: "macos-latest"
            target: "darwin"
            arch: "arm64"
          - platform: "ubuntu-22.04"
            target: "linux"
            arch: "x64"
            # Linux native-audio artifacts require glibc >= 2.35.
          - platform: "ubuntu-22.04-arm"
            target: "linux"
            arch: "arm64"
            # Linux native-audio artifacts require glibc >= 2.35.
          - platform: "windows-latest"
            target: "win32"
            arch: "x64"
          - platform: "windows-11-arm"
            target: "win32"
            arch: "arm64"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm install --frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile
          fi
        env:
          CYPRESS_INSTALL_BINARY: ${{ matrix.platform == 'windows-11-arm' && '0' || '' }}

      - name: Patch node-gyp and run pending install scripts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/native-audio/ci/patch-node-gyp-vs2026.mjs
          pnpm rebuild --pending
        env:
          CYPRESS_INSTALL_BINARY: ${{ matrix.platform == 'windows-11-arm' && '0' || '' }}

      - name: Setup native audio (libmpv addon + runtime)
        uses: ./.github/actions/setup-native-audio
        with:
          platform: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}

      - name: Build and publish with Electron Forge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          # Uncomment and add these secrets to your GitHub repository for signing:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            # Linux bundles an audio-only libmpv with its .so runtime closure;
            # strict verification ensures the bundled runtime is complete. The
            # artifacts are built on Ubuntu 22.04 and require glibc >= 2.35.
            # See docs/native-audio-libmpv.md.
            pnpm native-audio:verify-package --require-native-audio --platform linux --arch ${{ matrix.arch }}
            pnpm electron:build
            pnpm exec electron-forge publish --platform linux --arch ${{ matrix.arch }}
          else
            pnpm run publish --arch ${{ matrix.arch }}
          fi

  publish-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web assets
        run: pnpm run build:mobile

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Restore Android release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_B64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aonsoku-release.jks"
          test -s "$RUNNER_TEMP/aonsoku-release.jks"
          chmod 600 "$RUNNER_TEMP/aonsoku-release.jks"

      - name: Build Release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_aonsokuReleaseStoreFile: ${{ runner.temp }}/aonsoku-release.jks
          ORG_GRADLE_PROJECT_aonsokuReleaseStorePassword: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_aonsokuReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_aonsokuReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify Android release signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Get version from package.json
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk Aonsoku-v${{ steps.app_version.outputs.version }}-android.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Aonsoku-v${{ steps.app_version.outputs.version }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Android release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/aonsoku-release.jks"
