name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.21.0)"
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update package.json version
        run: |
          jq '.version = "${{ inputs.version }}"' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Update Android app version
        run: pnpm exec capacitor-set-version set:android -v "${{ inputs.version }}" -b 1

      - name: Update native iOS app version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "ios/Aonsoku.xcodeproj/project.pbxproj";
            const version = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }
            const input = fs.readFileSync(path, "utf8");
            const output = input.replace(/MARKETING_VERSION = [^;]+;/g, `MARKETING_VERSION = ${version};`);
            if (output === input) throw new Error("No iOS version settings were updated");
            fs.writeFileSync(path, output);
          '

      - name: Commit version update
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git add package.json android/app/build.gradle.kts ios/Aonsoku.xcodeproj/project.pbxproj
          git commit -m "chore(release): bump version to ${{ inputs.version }}" || echo "No changes to commit"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
