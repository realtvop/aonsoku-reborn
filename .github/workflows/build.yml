name: "build"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15-intel"
            libmpv_platform: "darwin"
            target: "mac"
            arch: "x64"
          - platform: "macos-latest"
            libmpv_platform: "darwin"
            target: "mac"
            arch: "arm64"
          - platform: "ubuntu-22.04"
            libmpv_platform: "linux"
            target: "linux"
            arch: "x64"
          - platform: "ubuntu-22.04-arm"
            libmpv_platform: "linux"
            target: "linux"
            arch: "arm64"
          - platform: "windows-latest"
            libmpv_platform: "win32"
            target: "win"
            arch: "x64"
          - platform: "windows-11-arm"
            libmpv_platform: "win32"
            target: "win"
            arch: "arm64"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install frontend dependencies
        run: pnpm install
        env:
          # Skip Cypress binary download on Windows ARM (unsupported platform)
          CYPRESS_INSTALL_BINARY: ${{ matrix.platform == 'windows-11-arm' && '0' || '' }}

      - name: Setup native audio (libmpv addon + runtime)
        uses: ./.github/actions/setup-native-audio
        with:
          platform: ${{ matrix.libmpv_platform }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}

      - name: Build Electron app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            # Linux relies on the distro libmpv2 package; use non-strict
            # verification (strict runtime bundling is not viable because the
            # distro libmpv pulls in the graphics stack). See
            # docs/native-audio-libmpv.md.
            pnpm native-audio:verify-package --platform linux --arch ${{ matrix.arch }}
            pnpm electron:build
            pnpm exec electron-forge make --platform linux --arch ${{ matrix.arch }}
          else
            pnpm run build:${{ matrix.target }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/make/**/*.deb
            dist/make/**/*.rpm
            dist/make/**/*.AppImage
            dist/make/**/*.dmg
            dist/make/**/*.zip
          if-no-files-found: warn
