name: "build-ios"

on:
  workflow_call:
    inputs:
      publish_release:
        description: "Attach the unsigned IPA to the current GitHub release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go for embedded Tailscale
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Cache embedded Tailscale runtime
        uses: actions/cache@v4
        with:
          path: ios/AonsokuKit/Vendor/CTailscale.xcframework
          key: ios-tailscale-${{ hashFiles('scripts/build-ios-tailscale.sh') }}

      - name: Prepare embedded Tailscale runtime
        run: bash scripts/build-ios-tailscale.sh

      - name: Test AonsokuKit
        env:
          IOS_TEST_RESULT_BUNDLE: ${{ runner.temp }}/AonsokuNativeTests.xcresult
        run: ./scripts/test-ios-native.sh

      - name: Upload AonsokuKit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-xcresult
          path: ${{ runner.temp }}/AonsokuNativeTests.xcresult
          if-no-files-found: warn

      - name: Check iOS strings
        run: node scripts/check-ios-strings.mjs

      - name: Resolve build metadata
        run: echo "AONSOKU_BUILD_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Archive native iOS app
        run: |
          xcodebuild archive \
            -project ios/Aonsoku.xcodeproj \
            -scheme Aonsoku \
            -archivePath "$RUNNER_TEMP/Aonsoku.xcarchive" \
            -destination "generic/platform=iOS" \
            AONSOKU_BUILD_HASH="$AONSOKU_BUILD_HASH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Aonsoku.xcarchive/Products/Applications/Aonsoku.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Aonsoku-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aonsoku-unsigned-ipa
          path: ${{ runner.temp }}/Aonsoku-unsigned.ipa
          if-no-files-found: error

      - name: Name iOS release artifact
        if: ${{ inputs.publish_release }}
        run: mv "$RUNNER_TEMP/Aonsoku-unsigned.ipa" "$RUNNER_TEMP/Aonsoku-${GITHUB_REF_NAME}-ios-unsigned.ipa"

      - name: Upload iOS artifact to Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/Aonsoku-${{ github.ref_name }}-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
