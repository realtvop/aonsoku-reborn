[package]
name = "aonsoku-coordination-server"
version = "0.1.0"
edition = "2021"
description = "Cross-device coordination service for Aonsoku clients"
license = "MIT"
publish = false

[lib]
name = "aonsoku_coordination_server"
path = "src/lib.rs"

[[bin]]
name = "aonsoku-coordination-server"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
subtle = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
once_cell = "1"
futures-util = "0.3"
parking_lot = "0.12"
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1