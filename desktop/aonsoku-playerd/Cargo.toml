[package]
name = "aonsoku-playerd"
version = "0.1.0"
edition = "2021"
description = "Desktop audio sidecar foundation for Aonsoku"
license = "MIT"
publish = false

[lib]
name = "aonsoku_playerd"
path = "src/lib.rs"

[[bin]]
name = "aonsoku-playerd"
path = "src/main.rs"

[dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3.0", default-features = true }
