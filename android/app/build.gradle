apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseSigning = [
    storeFile: project.findProperty('aonsokuReleaseStoreFile'),
    storePassword: project.findProperty('aonsokuReleaseStorePassword'),
    keyAlias: project.findProperty('aonsokuReleaseKeyAlias'),
    keyPassword: project.findProperty('aonsokuReleaseKeyPassword'),
]
def releaseSigningConfigured = releaseSigning.values().every { value ->
    value != null && !value.toString().trim().isEmpty()
}

def nativeVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version.toString()
def nativeVersionParts = nativeVersion.tokenize('-')[0].tokenize('.').collect { it.toInteger() }

android {
    namespace = "github.realtvop.aonsoku"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "github.realtvop.aonsoku"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nativeVersionParts[0] * 1000000 + nativeVersionParts[1] * 1000 + nativeVersionParts[2]
        versionName nativeVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { compose true }
    compileOptions { coreLibraryDesugaringEnabled true }
    kotlinOptions { jvmTarget = "21" }
    // The native launcher never loads a bundled SPA.
    sourceSets.main.assets.setSrcDirs(['src/main/nativeAssets'])
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                'Release signing is not configured. Set the aonsokuRelease* Gradle properties.'
            )
        }
        def keystore = file(releaseSigning.storeFile)
        if (!keystore.isFile()) {
            throw new GradleException("Release keystore does not exist: ${keystore}")
        }
    }
}

tasks.matching { task ->
    task.name in ['assembleRelease', 'bundleRelease']
}.configureEach {
    dependsOn(verifyReleaseSigning)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha01'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.material:material:1.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
